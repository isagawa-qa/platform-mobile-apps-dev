name: iOS interactive tunnel

# Holds a booted iOS simulator + Appium server open behind a public tunnel so a
# developer on a non-macOS host can drive real discovery against it. This is the
# only free way to get an INTERACTIVE iOS session from Windows: CI normally runs
# one shot, and discovery needs a session you can look at, decide, and tap.
#
# SECURITY - read before running.
#   * The tunnel URL is an UNAUTHENTICATED Appium endpoint. Anyone holding it can
#     create sessions and drive the simulator.
#   * This repository is PUBLIC, so the workflow log is public, so the URL is
#     public the moment it is printed. Treat it as disclosed, not secret.
#   * Mitigations: GITHUB_TOKEN holds only `statuses: write` (it can set a commit
#     status and nothing else); the runner is ephemeral and holds no secrets; the
#     app under test is a public demo; the window is bounded and short by default.
#   * The URL, UDID and bundle id are ALSO posted as the `ios-tunnel` commit status
#     on the dispatched commit, because a running job's log cannot be read through
#     the API until the job ends. A client fetches them with:
#       gh api repos/<owner>/<repo>/commits/<sha>/statuses --jq '.[] | select(.context=="ios-tunnel")'
#   * Do NOT raise hold_minutes beyond what you are actively using, and do not
#     point this at anything private.

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: How long to hold the session open (max 240)
        required: true
        default: '30'

permissions:
  statuses: write

jobs:
  tunnel:
    runs-on: macos-15
    timeout-minutes: 250
    env:
      APPIUM_VERSION: 3.7.0
      XCUITEST_DRIVER_VERSION: 12.12.4
      APP_RELEASE_TAG: '2.2.2'
      APP_ASSET: SauceLabs-Demo-App.Simulator.XCUITest.zip
      APP_REPO: saucelabs/my-demo-app-ios

    steps:
      - uses: actions/checkout@v4

      - name: Pick a bootable iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version > xcode-version.txt
          XCODE_MAJOR="$(awk 'NR==1 {split($2, v, "."); print v[1]}' xcode-version.txt)"
          MAX_IOS_MAJOR=99
          if [ "${XCODE_MAJOR}" -le 16 ]; then MAX_IOS_MAJOR=18; fi
          xcrun simctl list devices available --json > devices.json
          python3 - <<PY
          import json, os, re
          cap = int("${MAX_IOS_MAJOR}")
          data = json.load(open("devices.json"))
          best = None
          for runtime, devices in data["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m: continue
              major, minor = int(m.group(1)), int(m.group(2))
              if major > cap: continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      key = (major, minor)
                      if best is None or key > best[0]:
                          best = (key, d, f"{major}.{minor}")
          if best is None:
              raise SystemExit("no available iPhone simulator at or below iOS %d" % cap)
          (_, device, version) = best
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("udid=%s\n" % device["udid"])
              fh.write("name=%s\n" % device["name"])
              fh.write("version=%s\n" % version)
          print("selected:", device["name"], version, device["udid"])
          PY

      - name: Boot the simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Fetch the reference app
        id: app
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o app.zip \
            "https://github.com/${APP_REPO}/releases/download/${APP_RELEASE_TAG}/${APP_ASSET}"
          unzip -q app.zip -d app
          APP_PATH="$(find app -maxdepth 2 -name '*.app' -print -quit)"
          test -n "${APP_PATH}" || { echo "no .app in the release asset"; exit 1; }
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Info.plist")"
          echo "app_path=${PWD}/${APP_PATH}" >> "$GITHUB_OUTPUT"
          echo "bundle_id=${BUNDLE_ID}" >> "$GITHUB_OUTPUT"

      - name: Install Appium and the XCUITest driver
        run: |
          set -euo pipefail
          npm install -g "appium@${APPIUM_VERSION}"
          appium driver install "xcuitest@${XCUITEST_DRIVER_VERSION}"
          appium driver list --installed

      # A first session normally BUILDS WebDriverAgent with xcodebuild, which
      # takes minutes. Through the tunnel that request would die at Cloudflare's
      # ~100 s proxy timeout (HTTP 524). The driver's prebuilt simulator WDA
      # removes the build, so sessions start in seconds.
      - name: Download prebuilt WebDriverAgent for the simulator
        id: wda
        run: |
          set -euo pipefail
          appium driver run xcuitest download-wda -- --outdir="${RUNNER_TEMP}/wda" --kind=sim --platform=ios
          WDA_APP="$(find "${RUNNER_TEMP}/wda" -maxdepth 2 -name 'WebDriverAgentRunner-Runner.app' -print -quit)"
          test -n "${WDA_APP}" || { echo "no WebDriverAgentRunner-Runner.app in the download"; ls -R "${RUNNER_TEMP}/wda"; exit 1; }
          echo "path=${WDA_APP}" >> "$GITHUB_OUTPUT"

      - name: Pre-install the app on the simulator
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" "${{ steps.app.outputs.app_path }}"

      - name: Start Appium, open the tunnel, and hold
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          DEVICE_NAME: ${{ steps.sim.outputs.name }}
          PLATFORM_VERSION: ${{ steps.sim.outputs.version }}
          APP_PATH: ${{ steps.app.outputs.app_path }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          WDA_APP: ${{ steps.wda.outputs.path }}
          HOLD_MINUTES: ${{ inputs.hold_minutes }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Appium, cloudflared and the hold live in ONE step deliberately. A
          # previous revision started Appium with & in its own step and opened
          # the tunnel in the next; by then Appium was gone. A background
          # process is not guaranteed to outlive the step whose shell started
          # it, so anything that must stay up for the hold starts here.
          brew install cloudflared

          # Runner-specific values are injected server-side, so a client only
          # needs the tunnel URL and the UDID - never a path on this runner.
          DEFAULT_CAPS="$(python3 -c 'import json,os; print(json.dumps({"appium:usePreinstalledWDA": True, "appium:prebuiltWDAPath": os.environ["WDA_APP"]}))')"
          appium --port 4723 --address 0.0.0.0 --log appium.log --log-level info --allow-cors \
            --default-capabilities "${DEFAULT_CAPS}" &
          APPIUM_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4723/status > /dev/null && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:4723/status > /dev/null; then
            echo "Appium never became ready locally"; cat appium.log; exit 1
          fi
          echo "Appium up locally (pid ${APPIUM_PID})"

          # Warm-up: prove a session starts BEFORE anything is exposed, using
          # exactly the caps a remote client sends (udid + bundleId). A failure
          # here is a WDA/driver problem, not a tunnel problem.
          WARM_BODY="$(python3 -c 'import json,os; print(json.dumps({"capabilities": {"alwaysMatch": {"platformName": "iOS", "appium:automationName": "XCUITest", "appium:udid": os.environ["UDID"], "appium:bundleId": os.environ["BUNDLE_ID"], "appium:wdaLaunchTimeout": 600000}}}))')"
          T0=$(date +%s)
          curl -sS --max-time 900 -H 'Content-Type: application/json' -d "${WARM_BODY}" \
            http://127.0.0.1:4723/session > warmup.json || true
          SID="$(python3 -c 'import json; print(json.load(open("warmup.json")).get("value", {}).get("sessionId", ""))' 2>/dev/null || true)"
          if [ -z "${SID}" ]; then
            echo "warm-up session FAILED"; cat warmup.json; tail -60 appium.log; exit 1
          fi
          echo "warm-up session ${SID} started in $(( $(date +%s) - T0 ))s"
          curl -sS -X DELETE "http://127.0.0.1:4723/session/${SID}" > /dev/null || true

          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4723             > cloudflared.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)"
            [ -n "${URL}" ] && break
            sleep 2
          done
          if [ -z "${URL}" ]; then
            echo "tunnel never published a URL"; tail -40 cloudflared.log; exit 1
          fi

          # The 2026-09-19 runs failed HERE with Appium up and the URL published:
          # the runner's own resolver had negatively cached the brand-new
          # hostname. Resolve through public DNS and pin it with --resolve, so the
          # self-check measures the tunnel, not this runner's DNS cache.
          HOST="${URL#https://}"
          tunnel_ok() {
            local ip
            ip="$(dig +short @1.1.1.1 "${HOST}" A | grep -E '^[0-9.]+$' | head -1)"
            [ -n "${ip}" ] || return 1
            curl -sf --max-time 10 --resolve "${HOST}:443:${ip}" "${URL}/status" > /dev/null
          }
          READY=""
          for i in $(seq 1 60); do
            if tunnel_ok; then READY=1; break; fi
            sleep 3
          done
          if [ -z "${READY}" ]; then
            echo "tunnel published ${URL} but Appium unreachable through it after 180s"
            echo "--- dig @1.1.1.1 ---"; dig +short @1.1.1.1 "${HOST}" A || true
            echo "--- local appium ---";  curl -sS --max-time 5 http://127.0.0.1:4723/status || echo "(local Appium is DOWN)"
            echo "--- cloudflared ---";   tail -40 cloudflared.log
            exit 1
          fi

          cat <<FACTS
          ================= APPIUM SESSION IS OPEN =================
          remoteServerUrl : ${URL}
          udid            : ${UDID}
          deviceName      : ${DEVICE_NAME}
          platformVersion : ${PLATFORM_VERSION}
          app             : ${APP_PATH}
          bundleId        : ${BUNDLE_ID}
          holding open for: ${HOLD_MINUTES} minutes
          --- on your machine (device location 'remote') ---
          IOS_DEVICE_APPIUM_URL=${URL}
          IOS_UDID=${UDID}
          ==========================================================
          FACTS

          # Publish the session where a client can read it WHILE the job runs.
          # target_url carries the tunnel URL; the description carries udid and
          # bundle id (GitHub truncates descriptions at 140 chars - both fit).
          post_status() {
            gh api -X POST "repos/${REPO}/statuses/${SHA}" \
              -f state="$1" -f context=ios-tunnel -f target_url="$2" -f description="$3" > /dev/null \
              || echo "WARN: could not post the ios-tunnel commit status"
          }
          post_status pending "${URL}" "udid=${UDID} bundleId=${BUNDLE_ID}"

          MINUTES=${HOLD_MINUTES}
          [ "$MINUTES" -gt 240 ] && MINUTES=240
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! tunnel_ok; then
              echo "session became unreachable through the tunnel"
              post_status failure "${RUN_URL}" "tunnel became unreachable"
              curl -sS --max-time 5 http://127.0.0.1:4723/status || echo "(local Appium is DOWN too)"
              tail -30 appium.log; tail -20 cloudflared.log; exit 1
            fi
            sleep 30
          done
          echo "hold window elapsed cleanly"
          post_status success "${RUN_URL}" "tunnel closed: hold window elapsed"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tunnel-logs
          path: |
            appium.log
            cloudflared.log
          if-no-files-found: warn
