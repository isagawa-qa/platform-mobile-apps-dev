[pytest]
# Markers are declared here AND auto-discovered at runtime by
# _register_dynamic_markers in tests/conftest.py, which AST-scans tests/ for
# @pytest.mark.X. The explicit list below is the platform contract; the dynamic
# scan is what lets generated tests introduce a marker without editing this file.
markers =
    ios: runs against an iOS device, simulator or Safari
    android: runs against an Android device, emulator or Chrome
    web: runs in a mobile-web context rather than a native one

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --platform intentionally has no default here. conftest resolves it from the
# CLI flag, then PLATFORM in the environment, then default_platform in
# framework/resources/config/environment_config.json. Pinning a value in this
# file would put a platform choice in two places.
addopts =
    -v
    --tb=short
    --strict-markers
